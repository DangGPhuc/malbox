name: malbox-ai CI

on:
  push:
    branches: [ "main", "dev", "rebuild/*", "audit/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Compile check (bytecode verification)
        run: |
          python -m compileall -q backend/app backend/tests scripts

      - name: Module import check
        run: |
          python -c "
          import importlib, pkgutil, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('backend').resolve()))
          import app
          for m in pkgutil.walk_packages(app.__path__, app.__name__ + '.'):
              importlib.import_module(m.name)
          print('All backend app modules imported successfully.')
          "

      - name: Run Pytest Suite & Security Regression Tests
        run: |
          pytest -v backend/tests/

  frontend-build:
    name: Frontend Build & Typecheck (Node 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build frontend distribution
        run: |
          cd frontend
          npm run build
